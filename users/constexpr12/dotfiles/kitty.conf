auto_reload_config 0.1
font_family      family="Iosevka Nerd Font" style="Regular"
bold_font        family="Iosevka Nerd Font" style="ExtraBold"
italic_font      family="Iosevka Nerd Font" style="Light Oblique"
bold_italic_font family="Iosevka Nerd Font" style="Heavy Italic"
font_size 11.0
symbol_map U+ED00-U+F2FF                                    Iosevka Nerd Font
symbol_map U+E200-U+E2A9                                    Iosevka Nerd Font
symbol_map U+F0001-U+F1AF0                                  Iosevka Nerd Font
symbol_map U+E300-U+E3E3                                    Iosevka Nerd Font
symbol_map U+F400-U+F533,U+2665,U+26A1                      Iosevka Nerd Font
symbol_map U+E0A0-U+E0A2,U+E0B0-U+E0B3                      Iosevka Nerd Font
symbol_map U+E0A3,U+E0B4-U+E0C8,U+E0CA,U+E0CC-U+E0D7,U+2630 Iosevka Nerd Font
symbol_map U+23FB-U+23FE,U+2B58                             Iosevka Nerd Font
symbol_map U+F300-U+F381                                    Iosevka Nerd Font
symbol_map U+EA60-U+EC1E                                    Iosevka Nerd Font
scrollback_lines 2000
scrollbar_interactive no
mouse_hide_wait 0.5 0.1 40 no
url_style straight
enable_audio_bell no
visual_bell_duration 0.5
visual_bell_color #111111
remember_window_size  no
initial_window_width  960
initial_window_height 540
window_padding_width 0
single_window_padding_width -1
active_border_color #00ff00
inactive_border_color #cccccc
tab_bar_edge bottom
tab_bar_margin_width 0.0
tab_bar_margin_height 4.0 0.0
tab_bar_style powerline
tab_bar_align left
tab_bar_show_new_tab_button no
tab_bar_min_tabs 2
tab_switch_strategy previous
tab_fade 0.25 0.5 0.75 1
tab_powerline_style slanted
tab_title_template "{bell_symbol}{tab.last_focused_progress_percent}{tab.active_exe}"
active_tab_title_template "{bell_symbol}{tab.last_focused_progress_percent}{tab.active_exe} - {tab.active_wd}"
tab_bar_background #333
linux_display_server wayland
wayland_enable_ime yes
kitty_mod ctrl+shift
map kitty_mod+f2 edit_config_file
map cmd+,        edit_config_file
